[project]
name = "emarsys-mcp"
version = "1.0.0"
description = "SAP Emarsys Customer Engagement FastMCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
